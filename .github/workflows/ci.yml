name: CI
on:
  push:
    branches: [main, 001-multilingual-faq-page]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest + content bundles
        run: scripts/validate.sh
      - name: Package (dry run)
        run: scripts/package.sh
